version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: simulainvest_db
    environment:
      POSTGRES_USER: simulainvest
      POSTGRES_PASSWORD: simulainvest
      POSTGRES_DB: simulainvest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulainvest"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simulainvest_network

  redis:
    image: redis:7-alpine
    container_name: simulainvest_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simulainvest_network

  backend:
    build: ./backend
    container_name: simulainvest_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://simulainvest:simulainvest@postgres:5432/simulainvest
      REDIS_URL: redis://redis:6379
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "true"
      BRAPI_KEY: ${BRAPI_KEY:-}
      ANBIMA_KEY: ${ANBIMA_KEY:-}
    volumes:
      - ./backend:/app
    networks:
      - simulainvest_network

volumes:
  postgres_data:

networks:
  simulainvest_network:
    driver: bridge

